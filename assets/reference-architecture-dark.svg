<svg xmlns="http://www.w3.org/2000/svg" width="640" height="584" viewBox="0 0 640 584" role="img" aria-labelledby="t d">
  <title id="t">Reference platform architecture</title>
  <desc id="d">A client calls an API gateway. The gateway routes to Orders and Inventory modules, which share a PostgreSQL database. Orders publishes events through an outbox to a message broker, which feeds Notifications. Modules emit traces and metrics to OpenTelemetry, which feeds dashboards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#7aa2f7"/>
    </marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#9ece6a"/>
    </marker>
  </defs>
  <style>
    .flow { animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <rect width="640" height="584" rx="16" fill="url(#bg)" stroke="#3b4261"/>

  <path d="M320 68 V100" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M320 148 V176 H190 V200" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M320 148 V176 H450 V200" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M190 248 V324 H245" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M450 248 V324 H395" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M105 224 H70 V404" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <text x="62" y="330" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7f88b5">outbox</text>
  <path d="M110 452 V484" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
  <path d="M535 224 H592 V428 H575" fill="none" stroke="#9ece6a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7" class="flow" marker-end="url(#arrow-t)"/>
  <path d="M500 452 V484" fill="none" stroke="#9ece6a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7" class="flow" marker-end="url(#arrow-t)"/>
  <text x="20" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7f88b5">Solid: requests and events. Green: telemetry.</text>

  <g>
      <rect x="260" y="20" width="120" height="48" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1.5"/>
      <text x="320" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#c0caf5">Client</text>
    </g>
  <g>
      <rect x="235" y="100" width="170" height="48" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1.5"/>
      <text x="320" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#c0caf5">API Gateway</text>
    </g>
  <g>
      <rect x="105" y="200" width="170" height="48" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1.5"/>
      <text x="190" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#c0caf5">Orders module</text>
    </g>
  <g>
      <rect x="365" y="200" width="170" height="48" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1.5"/>
      <text x="450" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#c0caf5">Inventory module</text>
    </g>
  <g>
      <rect x="245" y="300" width="150" height="48" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1.5"/>
      <text x="320" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#c0caf5">PostgreSQL</text>
    </g>
  <g>
      <rect x="35" y="404" width="150" height="48" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1.5"/>
      <text x="110" y="434" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#c0caf5">Message broker</text>
    </g>
  <g>
      <rect x="35" y="484" width="150" height="48" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1.5"/>
      <text x="110" y="514" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#c0caf5">Notifications</text>
    </g>
  <g>
      <rect x="425" y="404" width="150" height="48" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1.5"/>
      <text x="500" y="434" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#c0caf5">OpenTelemetry</text>
    </g>
  <g>
      <rect x="425" y="484" width="150" height="48" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1.5"/>
      <text x="500" y="514" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#c0caf5">Dashboards</text>
    </g>
</svg>
