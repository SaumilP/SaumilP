<svg xmlns="http://www.w3.org/2000/svg" width="480" height="266" viewBox="0 0 480 266" role="img" aria-label="GitHub Overview: saumilp">
  <title>GitHub Overview: saumilp</title>
  <defs>
    <clipPath id="clip"><rect width="480" height="266" rx="14"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d63c8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2d63c8" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#2d63c8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d63c8"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <style>
      .card { animation: rise 600ms cubic-bezier(.2,.8,.2,1) 0ms both; }
      .t { animation: fade 500ms ease-out both; }
      .c { animation: colin 450ms cubic-bezier(.2,.8,.2,1) both; }
      .sweep { animation: sweep 7s ease-in-out 1500ms infinite; }
      .trail { animation: trail 9s linear 0ms infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
      @keyframes colin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes sweep { 0% { transform: translateX(-240px); } 35%, 100% { transform: translateX(480px); } }
      @keyframes trail { to { stroke-dashoffset: -1562; } }
      @media (prefers-reduced-motion: reduce) {
        .card, .t, .c, .sweep, .trail { animation: none; }
        .trail { display: none; }
      }
    </style>
  </defs>
  <g class="card">
    <g clip-path="url(#clip)">

  
  <defs>
    <style>
      
      @keyframes ghstatsGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .ghstats-bar-fill { transform-box: fill-box; transform-origin: left center; animation: ghstatsGrow 900ms cubic-bezier(.2,.8,.2,1) both; }
      @media (prefers-reduced-motion: reduce) { .ghstats-bar-fill { animation: none; } }
    
    </style>
    
  </defs>
