name: Generate Banners

on:
  push:
    branches: [main]
    paths:
      - scripts/generate-banners.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  banners:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate light and dark banners
        run: npm run generate:banners

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: regenerate profile banners"
            git push
          else
            echo "No changes to commit"
          fi
