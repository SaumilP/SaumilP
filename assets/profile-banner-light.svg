<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Saumil — systems designer, hands-on</title>
  <desc id="d">Profile banner: Saumil, systems designer who stays hands-on. A small diagram shows a gateway, two services and a database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f4f9"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2d63c8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2d63c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#8250df" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d63c8"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2d63c8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .flow { animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .flow { animation: none; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>
    <rect y="314" width="1200" height="6" fill="url(#bar)"/>

    <!-- prompt line -->
    <text x="72" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#5b6676">
      <tspan fill="#1a7f37">~/saumil</tspan> <tspan fill="#2d63c8">$</tspan> whoami
    </text>

    <!-- title -->
    <text x="72" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#0f172a">Saumil</text>
    <rect class="cursor" x="318" y="108" width="10" height="64" rx="2" fill="#2d63c8"/>

    <!-- subtitle -->
    <text x="72" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#334155">Systems Designer · Hands-on</text>
    <text x="72" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#5b6676">Designing systems that stay simple in production.</text>

    <!-- stack chips -->
    <g transform="translate(72 266)"><g transform="translate(0 0)">
      <rect width="146" height="34" rx="17" fill="#ffffff" stroke="#cfd7e3"/>
      <text x="73" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2937">Architecture</text>
    </g>
<g transform="translate(158 0)">
      <rect width="211" height="34" rx="17" fill="#ffffff" stroke="#cfd7e3"/>
      <text x="105.5" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2937">Distributed Systems</text>
    </g>
<g transform="translate(381 0)">
      <rect width="64" height="34" rx="17" fill="#ffffff" stroke="#cfd7e3"/>
      <text x="32" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2937">DDD</text>
    </g>
<g transform="translate(457 0)">
      <rect width="110" height="34" rx="17" fill="#ffffff" stroke="#cfd7e3"/>
      <text x="55" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2937">Platform</text>
    </g></g>

<g transform="translate(0 0)">
    <path d="M925 104 V127 H825 V150" fill="none" stroke="#2d63c8" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" class="flow" style="animation-delay:0s"/>
    <path d="M925 104 V127 H1025 V150" fill="none" stroke="#2d63c8" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" class="flow" style="animation-delay:0.3s"/>
    <path d="M825 194 V215 H900 V236" fill="none" stroke="#2d63c8" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" class="flow" style="animation-delay:0.6s"/>
    <path d="M1025 194 V215 H950 V236" fill="none" stroke="#2d63c8" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" class="flow" style="animation-delay:0.9s"/>
    <g>
      <rect x="840" y="60" width="170" height="44" rx="10" fill="#ffffff" stroke="#cfd7e3"/>
      <text x="925" y="87" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2937">API Gateway</text>
    </g>
    <g>
      <rect x="750" y="150" width="150" height="44" rx="10" fill="#ffffff" stroke="#cfd7e3"/>
      <text x="825" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2937">Orders</text>
    </g>
    <g>
      <rect x="950" y="150" width="150" height="44" rx="10" fill="#ffffff" stroke="#cfd7e3"/>
      <text x="1025" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2937">Billing</text>
    </g>
    <g>
      <rect x="860" y="236" width="130" height="44" rx="10" fill="#ffffff" stroke="#cfd7e3"/>
      <text x="925" y="263" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1f2937">Postgres</text>
    </g>
  </g>
  </g>
</svg>
